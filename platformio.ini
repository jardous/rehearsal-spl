[platformio]
default_envs = meter

[env]
platform = espressif32@6.9.0
board = adafruit_matrixportal_esp32s3
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.0
lib_deps =
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit BusIO@1.16.1
    https://github.com/adafruit/Adafruit_Protomatter.git#d55e3bf83306b19651c1905bfb984f3768c2569e
; Protomatter declares dependencies used only by its examples. Never link them.
lib_ignore =
    Adafruit LIS3DH
    Adafruit Unified Sensor
    Adafruit PixelDust
    AnimatedGIF
    Adafruit SPIFlash
    Adafruit TinyUSB Library
    Adafruit NeoPixel
    SdFat - Adafruit Fork
monitor_speed = 115200
build_flags = -Wall -Wextra

[env:meter]
build_src_filter = +<*> -<matrix_smoke.cpp>

[env:mock]
build_src_filter = ${env:meter.build_src_filter}
build_flags = ${env.build_flags} -DSPL_MOCK_INPUT=1

[env:matrix_test]
build_src_filter = +<matrix_smoke.cpp>
